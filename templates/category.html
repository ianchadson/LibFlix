<!doctype html>
<html lang="{{ 'zh' if book_lang == 'cn' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ shelf.name }} - LibFlix</title>
  <style data-page-style>
    * { box-sizing: border-box; }
    body { background: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .navbar { background: linear-gradient(180deg, rgba(20,20,20,.9) 0, rgba(20,20,20,.5) 80%, transparent); z-index: 10; min-height: 48px; }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: #e50914 !important; letter-spacing: -1px; }
    .mode-toggle { display: flex; background: rgba(255,255,255,.08); border-radius: 20px; padding: 1px; }
    .mode-btn { padding: 2px 10px; border-radius: 18px; font-size: .7rem; color: #aaa; text-decoration: none; white-space: nowrap; transition: all .15s; }
    .mode-btn.active { background: #e50914; color: #fff; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab { flex-shrink: 0; padding: 2px 10px; border-radius: 20px; font-size: .75rem; color: #aaa; text-decoration: none; transition: all .15s; white-space: nowrap; }
    .cat-tab:hover { background: rgba(255,255,255,.1); color: #fff; }
    .cat-tab.active { background: #e50914; color: #fff; }

    .page-title { font-size: 1.6rem; font-weight: 700; padding: 1.5rem 1rem .6rem; }

    .book-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 1rem 2rem; justify-content: center; }
    .book-card { width: 150px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; position: relative; border-radius: 8px; overflow: hidden; background:#242424; box-shadow: 0 8px 22px rgba(0,0,0,.18); }
    .book-card:hover { transform: scale(1.06); z-index: 5; box-shadow: 0 18px 42px rgba(0,0,0,.46); }
    .book-card img { width: 150px; height: 225px; object-fit: cover; border-radius: 8px; display: block; background: #333; opacity: 0; transition: opacity .22s ease; position: relative; z-index: 2; }
    .book-card img.loaded { opacity: 1; }
    .book-card .cover-skeleton { position:absolute; inset:0; background: linear-gradient(110deg,#232323 8%,#303030 18%,#232323 33%); background-size: 200% 100%; animation: coverShimmer 1.15s linear infinite; z-index: 0; }
    @keyframes coverShimmer { to { background-position-x: -200%; } }
    .book-card .info { position: absolute; bottom: 0; left: 0; right: 0; padding: 58px 10px 10px; background: linear-gradient(180deg, transparent 0%, rgba(4,5,8,.45) 38%, rgba(4,5,8,.9) 74%, rgba(4,5,8,.98) 100%); opacity: 0; transform: translateY(10px); transition: opacity .18s ease, transform .18s ease; z-index: 3; text-shadow: 0 1px 3px rgba(0,0,0,.78); }
    .book-card:hover .info, a:focus-visible .book-card .info { opacity: 1; transform: translateY(0); }
    .book-card .info .t { font-size: .82rem; font-weight: 700; line-height: 1.12; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-card .info .a { font-size: .7rem; font-weight: 500; color: rgba(255,255,255,.76); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-card .placeholder { width: 150px; height: 225px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #555; border-radius: 8px; position: relative; z-index: 2; }

    .category-load-placeholder { height:225px; cursor:default; box-shadow:none; pointer-events:none; }
    .category-load-placeholder::after { position:absolute; inset:0; background:linear-gradient(110deg, transparent 12%, rgba(255,255,255,.055) 25%, transparent 38%); background-size:220% 100%; content:""; animation:coverShimmer 1.15s linear infinite; }
    .category-load-feedback { display:none; min-height:42px; align-items:center; justify-content:center; gap:10px; padding:4px 16px 24px; color:#8e8e93; font-size:.82rem; }
    .category-load-feedback.is-visible { display:flex; }
    .category-load-feedback button { min-height:32px; padding:0 12px; border:1px solid rgba(255,255,255,.16); border-radius:6px; background:#1b1c20; color:#f0f0f1; font:700 .78rem/1 'Helvetica Neue', Arial, sans-serif; cursor:pointer; }
    .category-load-feedback button:hover { border-color:rgba(255,255,255,.28); background:#222328; }
    .scroll-sentinel { height: 1px; }

    @media (max-width: 768px) {
      .book-card, .book-card img { width: 120px; }
      .book-card img { height: 180px; }
      .book-card .placeholder { width: 120px; height: 180px; }
      .category-load-placeholder { height:180px; }
      .cat-tab { font-size: .65rem; padding: 2px 6px; }
    }
    @media (max-width: 992px) {
      .cat-tab { font-size: .7rem; padding: 2px 8px; }
    }
  </style>
  <link href="{{ url_for('static', filename='libflix.css', v=asset_version) }}" rel="stylesheet">
</head>
<body class="page-category">
  {% set active_tab = topic %}
  {% include "_navbar.html" %}

  <main id="mainContent">
  <div class="page-title">{{ shelf.name }}</div>

  <div class="book-grid" id="bookGrid">
    {% for book in shelf.books[:12] %}
    {% include "_book_card.html" %}
    {% endfor %}
  </div>
  {% if not shelf.books %}
  <div class="empty-state" id="emptyState">No books are available here yet.</div>
  {% endif %}

  <div id="scrollSentinel" class="scroll-sentinel" aria-hidden="true"></div>
  <div class="category-load-feedback" id="loadFeedback" role="status" aria-live="polite">
    <span>Couldn't load more</span>
    <button id="retryLoad" type="button">Retry</button>
  </div>

  {% include "_footer.html" %}
  </main>

  <script data-page-script>
    const TOPIC = {{ topic | tojson }};
    const MODE = {{ mode | tojson if mode else 'nonfiction' | tojson }};
    const BOOK_LANG = {{ book_lang | tojson }};
    const INITIAL_BATCH_SIZE = 12;
    let pendingBooks = {{ shelf.books[12:] | tojson }};
    let currentPage = 1;
    let totalPages = Infinity;
    let loading = false;
    let finished = false;
    let observer = null;
    let fillTimer = null;
    let meaningfulScroll = false;
    let loadFailed = false;
    const scrollOrigin = window.scrollY;
    const scrollSentinel = document.getElementById('scrollSentinel');
    const loadFeedback = document.getElementById('loadFeedback');
    const retryLoad = document.getElementById('retryLoad');

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function bookUrl(book) {
      const key = (book.ol_key || '').replace(/^\/?works\//, '');
      if (!key) return '/preview';
      const prefix = (MODE === 'fiction' ? '/fiction' : '') + (BOOK_LANG === 'cn' ? '/cn' : '');
      return (prefix || '') + '/book/' + encodeURIComponent(key);
    }

    function renderBooks(books) {
      const grid = document.getElementById('bookGrid');
      const emptyState = document.getElementById('emptyState');
      if (emptyState) emptyState.style.display = 'none';
      for (const b of books) {
        const href = bookUrl(b);
        const card = document.createElement('a');
        card.href = href;
        card.className = 'book-card-link';
        const imgFallback = 'this.style.display=\'none\';this.parentNode.querySelector(\'.ph-fallback\').style.display=\'flex\';';
        card.innerHTML = '<div class="book-card" data-ol-key="' + esc(b.ol_key || '') + '" data-title="' + esc(b.title || '') + '" data-author="' + esc(b.author || '') + '" data-rating-average="' + esc(String(b.rating_average || 0)) + '" data-ratings-count="' + esc(String(b.ratings_count || 0)) + '" data-rating-source="' + esc(b.rating_source || '') + '" data-rating-url="' + esc(b.rating_url || '') + '">' +
          (b.cover_url ? '<div class="cover-skeleton"></div><img data-cover-src="' + esc(b.cover_url) + '" alt="' + esc(b.title) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add(\'loaded\')" onerror="' + imgFallback + '"><div class="placeholder ph-fallback" style="display:none" aria-label="No cover available"></div>' : '<div class="placeholder" aria-label="No cover available"></div>') +
          '<div class="info"><div class="t">' + (b.title.length > 50 ? esc(b.title.slice(0,50)) + '...' : esc(b.title)) + '</div>' +
          (b.author ? '<div class="a">' + (b.author.length > 35 ? esc(b.author.slice(0,35)) + '...' : esc(b.author)) + '</div>' : '') +
          '</div></div>';
        grid.appendChild(card);
      }
      window.LibFlixCoverLoader?.register(grid);
    }

    function renderNextBatch() {
      if (!pendingBooks.length) return 0;
      const batch = pendingBooks.splice(0, INITIAL_BATCH_SIZE);
      renderBooks(batch);
      if (!pendingBooks.length && currentPage >= totalPages) finishLoading();
      return batch.length;
    }

    function setLoading(on) {
      const grid = document.getElementById('bookGrid');
      grid.querySelectorAll('.category-load-placeholder').forEach(node => node.remove());
      if (!on) return;
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < 6; index += 1) {
        const placeholder = document.createElement('div');
        placeholder.className = 'book-card category-load-placeholder';
        placeholder.setAttribute('aria-hidden', 'true');
        fragment.appendChild(placeholder);
      }
      grid.appendChild(fragment);
    }

    function setLoadError(on) {
      loadFailed = on;
      loadFeedback.classList.toggle('is-visible', on);
    }

    function finishLoading() {
      finished = true;
      if (scrollSentinel) scrollSentinel.style.display = 'none';
    }

    function loadMore(allowWithoutScroll = false) {
      if (loading || finished || loadFailed) return;
      if (renderNextBatch()) return;
      if (!meaningfulScroll && !allowWithoutScroll) return;
      if (currentPage >= totalPages) {
        finishLoading();
        return;
      }
      loading = true;
      setLoadError(false);
      setLoading(true);
      const nextPage = currentPage + 1;
      fetch('/api/category/' + encodeURIComponent(TOPIC) + '?page=' + nextPage + '&mode=' + encodeURIComponent(MODE) + '&book_lang=' + encodeURIComponent(BOOK_LANG))
        .then(r => r.json())
        .then(data => {
          if (!data.success || !data.books.length) {
            totalPages = nextPage;
            finishLoading();
            return;
          }
          pendingBooks.push(...data.books);
          currentPage = data.page || nextPage;
          totalPages = data.total_pages || totalPages;
          renderNextBatch();
        })
        .catch(() => setLoadError(true))
        .finally(() => {
          loading = false;
          setLoading(false);
          if (!loadFailed) fillViewportIfNeeded();
        });
    }

    function nearPageBottom() {
      return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 700;
    }

    function maybeLoadMore() {
      if (Math.abs(window.scrollY - scrollOrigin) >= Math.min(24, window.innerHeight * .08)) meaningfulScroll = true;
      if (nearPageBottom()) loadMore();
    }

    function fillViewportIfNeeded() {
      if (finished || loadFailed || document.documentElement.scrollHeight > window.innerHeight + 24) return;
      if (pendingBooks.length) {
        if (renderNextBatch()) fillTimer = window.setTimeout(fillViewportIfNeeded, 60);
        return;
      }
      loadMore(true);
    }

    if ('IntersectionObserver' in window && scrollSentinel) {
      observer = new IntersectionObserver(entries => {
        if (!loadFailed && entries.some(entry => entry.isIntersecting) && (pendingBooks.length || meaningfulScroll)) loadMore();
      }, { rootMargin: '700px 0px' });
      observer.observe(scrollSentinel);
    }

    window.addEventListener('scroll', maybeLoadMore, { passive: true });
    window.addEventListener('resize', fillViewportIfNeeded);
    retryLoad.addEventListener('click', () => {
      setLoadError(false);
      loadMore(true);
    });
    fillTimer = window.setTimeout(fillViewportIfNeeded, 250);
    window.LibFlixPageCleanup = () => {
      observer?.disconnect();
      if (fillTimer) window.clearTimeout(fillTimer);
      window.removeEventListener('scroll', maybeLoadMore);
      window.removeEventListener('resize', fillViewportIfNeeded);
    };
  </script>
</body>
</html>
